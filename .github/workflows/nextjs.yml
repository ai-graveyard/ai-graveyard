# 基于 GitHub 官方的 "Deploy Next.js site to Pages" 示例改造，两处按本项目实际情况调整：
#
# 1. 包管理器固定为 pnpm。官方的 detect-package-manager 步骤只认 yarn.lock，
#    否则一律走 npm ci —— 本仓库只有 pnpm-lock.yaml，会直接失败。
# 2. configure-pages 不传 static_site_generator: next。那个选项会按 Pages API
#    返回的站点地址往 next.config.ts 注入 basePath/assetPrefix。本站走自定义域名
#    （public/CNAME），服务在根路径，注入反而会把资源指到 /ai-graveyard/ 子路径下；
#    而且它让构建结果取决于 Settings 里的配置状态，而不是仓库里的文件。
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # 官方模板哈希的是 package-lock.json / yarn.lock，pnpm 项目永远命中不了，
          # 这里换成 pnpm-lock.yaml。
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next.config.ts 里 output: "export"，产物落在 out/。
      # public/CNAME 会被一起拷进 out/，自定义域名靠它生效。
      - name: Build with Next.js
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
